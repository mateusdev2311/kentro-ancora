<!-- Botão do menu do topo. Identifica o usuário, pede um ticket ao serviço e abre o app no diálogo da Kentro. -->
<style>
  html, body { height: 100%; margin: 0; }
  #app { font: 14px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #acao { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 8px; background: #5b2a86; color: #fff; font: inherit; cursor: pointer; }
  [hidden] { display: none; }
</style>
<div id="app">
  <p id="msg" role="status">Abrindo o Método ÂNCORA…</p>
  <button id="acao" type="button" hidden>Abrir de novo</button>
</div>
<script>
(function () {
  var omni = globalThis.omni;
  var msg = document.getElementById('msg');
  var acao = document.getElementById('acao');

  function mensagemDe(erro) {
    if (erro && erro.message === 'config') return 'A extensão está sem o endereço do serviço. Avise o suporte.';
    if (erro && erro.code === 'rate_limited') return 'Muitas tentativas seguidas. Aguarde um minuto.';
    return 'Não foi possível abrir o Método ÂNCORA. Tente de novo.';
  }

  async function abrir(ctx) {
    acao.hidden = true;
    msg.textContent = 'Abrindo o Método ÂNCORA…';
    try {
      var config = ctx.config || {};
      var apiUrl = String(config.api_url || '').trim().replace(/\/+$/, '');
      if (!apiUrl) throw new Error('config');
      var usuario = await omni.session.getUser();
      var resposta = await omni.http.request({
        url: apiUrl + '/api/kentro/ticket',
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: { id: usuario.id, nome: usuario.name, email: usuario.email, tipo: usuario.type } })
      });
      if (resposta.status >= 400) throw new Error('http');
      await omni.ui.openEmbed({ url: JSON.parse(resposta.body).url, size: 'full', presentation: { mode: 'fullscreen' }, title: 'Método ÂNCORA' });
      msg.textContent = 'Aberto. Se fechar a janela do Método ÂNCORA, abra de novo por aqui.';
    } catch (erro) {
      msg.textContent = mensagemDe(erro);
    }
    acao.hidden = false;
  }

  omni.ready(function (ctx) {
    acao.addEventListener('click', function () { abrir(ctx || {}); });
    abrir(ctx || {});
  });
})();
</script>
